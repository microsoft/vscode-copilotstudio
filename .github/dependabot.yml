# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "*"
    schedule:
      interval: daily
    target-branch: "main"
    labels:
      - 'dependencies'
    reviewers:
      - 'microsoft/vscode-copilot-studio-approvers'
    groups:
      # Microsoft.Agents.* (objectmodel) packages publish in lockstep at a
      # single version, so group them into one dedicated PR, separate from the
      # general dependency bumps. No update-types filter, so every stable
      # update is caught — including date-based year-rollovers that look like
      # a semver major (e.g. 2026.x -> 2027.x).
      objectmodel:
        patterns:
          - "Microsoft.Agents.*"
      all-dependencies:
        patterns:
          - "*"
        # Keep objectmodel out of the general group; it has its own group
        # above. exclude-patterns is what reliably removes a dependency from a
        # group — dependabot does not apply top-level `ignore` to group members
        # (dependabot/dependabot-core#10122).
        exclude-patterns:
          - "Microsoft.Agents.*"
        # Filters which update types are rolled into the grouped PR.
        # Majors are release decisions for this consumer app, not
        # dependency updates — keep them out of the group.
        # Note: unlike the npm ecosystem below, there is no top-level
        # `ignore` for non-Agents packages, so a nuget major may still
        # arrive as an individual PR. Add a matching `ignore` block if
        # that becomes noisy.
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
    directories:
      - "/src/vscode-extensions/*"
    schedule:
      interval: daily
    target-branch: "main"
    labels:
      - 'dependencies'
    reviewers:
      - 'microsoft/vscode-copilot-studio-approvers'
    # Companion to the group-level `update-types` filter below.
    # When a group excludes an update type, dependabot falls back to
    # creating an *individual* PR for that dependency. This ignore
    # suppresses that fallback so no major-bump PRs are created at all.
    # Do not rely on this alone to filter grouped updates — dependabot
    # does not apply `ignore` rules to members of a group
    # (dependabot/dependabot-core#10122); group-level `update-types`
    # is what actually filters the grouped PR.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      all-dependencies:
        patterns:
          - "*"
        # Filters which update types are rolled into the grouped PR.
        # Without this, the grouped PR includes majors even when they
        # match the top-level `ignore` above (known dependabot bug
        # dependabot/dependabot-core#10122). PR #180 was the repro:
        # @types/node 20.x → 25.x slipped into an all-dependencies group
        # even though the ignore rule was live in main.
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
